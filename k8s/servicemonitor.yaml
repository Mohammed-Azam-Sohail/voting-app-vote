apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vote-metrics
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - voting-app
  selector:
    matchLabels:
      app: vote
  endpoints:
    - port: vote-service
      path: /metrics
      interval: 15s
