apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vote-host-ingress
  namespace: voting-app
spec:
  ingressClassName: nginx
  rules:
    - host: vote.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vote
                port:
                  number: 8080
